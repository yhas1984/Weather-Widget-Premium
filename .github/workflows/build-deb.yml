name: Build and release Weather Widget Premium

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-xinerama0 libegl1 libgl1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Build package
        run: bash packaging/build-deb.sh "${GITHUB_REF_NAME#v}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" weather-widget-premium_*_amd64.deb --clobber
      - name: Upload workflow artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-widget-premium-${{ github.ref_name }}
          path: weather-widget-premium_*_amd64.deb
          if-no-files-found: error
